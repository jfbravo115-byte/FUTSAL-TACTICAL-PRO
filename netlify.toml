[build]
command = "npm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/api/tactical-pro"
to = "/.netlify/functions/tactical-pro"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
