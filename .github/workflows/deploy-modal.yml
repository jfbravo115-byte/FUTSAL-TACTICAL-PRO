name: Deploy YOLO to Modal
on: {push: {branches: [main], paths: ["modal_yolo_app.py", ".github/workflows/deploy-modal.yml"]}, workflow_dispatch: null}
jobs: {deploy: {name: Deploy, runs-on: ubuntu-latest, env: {MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}"}, steps: [{name: "Checkout", uses: "actions/checkout@v4"}, {name: "Install Python", uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {name: "Install Modal", run: "pip install modal"}, {name: "Deploy", run: "modal deploy modal_yolo_app.py"}]}}
